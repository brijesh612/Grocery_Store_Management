{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow text-center">
        <h2>Razorpay Payment</h2>
        <p class="fs-4 mt-2">Total Amount: <strong>RS {{ total }}</strong></p>

        <div class="mt-4">
       
            <button id="rzp-button1" class="btn btn-success btn-lg px-5">Pay Now</button>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ key }}",
        "amount": "{{ payment.amount }}",
        "currency": "INR",
        "name": "Grocery Mart",
        "description": "Wholesale Grocery Payment",
        "order_id": "{{ payment.id }}",
        "handler": function (response){
            window.location.href = "/order-success/" ;   
        },
        "theme": {
            "color": "#198754"
        }
    };

    var rzp1 = new Razorpay(options);

    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    }
</script>
{% endblock %}
