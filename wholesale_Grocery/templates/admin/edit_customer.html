<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 650px;">
    <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
        <div class="card-header bg-success text-white py-3" style="background: linear-gradient(135deg, #198754, #146c43);">
            <h4 class="mb-0 fw-bold fs-5 text-center text-uppercase"><i class="bi bi-pencil-square me-2"></i>Edit Customer</h4>
        </div>

        <div class="card-body p-4 bg-white">
            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ customer.name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Shop Name</label>
                        <input type="text" name="shopname" class="form-control" value="{{ customer.shopname }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Mobile</label>
                   <input type="text" name="mobile" class="form-control" value="{{ customer.mobile }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">E-Mail</label>
                        <input type="email" name="email" class="form-control" value="{{ customer.email }}" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-uppercase">Address</label>
                        <textarea name="address" class="form-control" rows="2" required>{{ customer.address }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">UserName</label>
                        <input type="text" name="username" class="form-control" value="{{ customer.username }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Password</label>
                        <input type="text" name="password" class="form-control" value="{{ customer.password }}" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'customer' %}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                    <button type="submit" class="btn btn-success px-4 fw-semibold shadow-sm">Update Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
