<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container mt-4" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Edit Category</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
    
                        <!-- Category Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Category Name</label>
                            <input type="text" name="categoryname" class="form-control" value="{{ category.categoryname }}" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="3" required>{{ category.description }}</textarea>
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Status</label>
                            <select name="status" class="form-select">
                                <option value="Active" {% if category.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if category.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success">Update Category</button>
                        <a href="{% url 'categories' %}" class="btn btn-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
