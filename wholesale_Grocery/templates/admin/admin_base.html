{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Grocery Admin</title>

    <!-- <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{%  static 'css/style.css' %}"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* design sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1e293b; /* dark navye  */
            z-index: 1000;
        }
        .sidebar-brand {
            padding: 20px 15px;
            font-size: 18px;
            font-weight: bold;
            color: #198754;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-link-custom {
            color: #94a3b8;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            color: #ffffff;
            background-color: #334155;
            border-left: 4px solid #198754;
        }
        .logout-btn {
            color: #dc3545 !important;
        }
        .logout-btn:hover {
            background-color: rgba(220, 53, 69, 0.1) !important;
            border-left: 4px solid #dc3545 !important;
        }
        /* main content layout */
        .main-wrapper {
            margin-left: 250px;
        }
    </style>
</head>

<body>


        <div class="sidebar d-flex flex-column justify-content-between">
            <div>
                <div class="sidebar-brand">
                    <i class="bi bi-cart-fill text-success fs-3"></i>
                    <span class="text-white">Grocery Admin</span>
                </div>

                <div class="nav flex-column mt-3">
                    <a href="{% url 'admin_dashboard' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                   
                    <a href="{% url 'categories' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'categories' %}active{% endif %}"><i class="bi bi-tags-fill"></i> Categories</a>

                    <a href="{% url 'addproduct' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'addproduct' %}active{% endif %}"><i class="bi bi-box-seam-fill"></i> Products</a>
                   
                    <a href="{% url 'customer' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'customer' %}active{% endif %}"><i class="bi bi-people-fill"></i> Customers</a>
                    
                    <a href="{% url 'admin_order_show' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'admin_order_show' %}active{% endif %}"><i class="bi bi-bag-check-fill"></i> Orders</a>
                  
                    <a href="{% url 'manage_payments' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'manage_payments' %}active{% endif %}"><i class="bi bi-credit-card-fill"></i> Payments</a>
                  
                    <a href="{% url 'manage_staff' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'manage_staff' %}active{% endif %}"><i class="bi bi-person-badge-fill"></i> Staff</a>
                   
                    <a href="{% url 'admin_tracker' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'admin_tracker' %}active{% endif %}"><i class="bi bi-geo-alt-fill"></i> Track </a>
                   
                    <a href="#" class="nav-link-custom"><i class="bi bi-bar-chart-line-fill"></i> Reports</a>
                </div>
            </div>

        
            <div class="p-3 border-top border-secondary">
                <a href="{% url 'admin_logout' %}" class="nav-link-custom logout-btn rounded-3">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>


        <div class="main-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
                <span class="navbar-brand fw-bold text-success mb-0">
                    Wholesale Grocery Management System
                </span>
            </nav>

            <div class="p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>

<!-- <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script> -->
</body>
</html>
