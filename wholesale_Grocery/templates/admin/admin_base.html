{% load static %}
<!DOCTYPE html>
<html lang="en">

            <hr>

            <ul class="nav flex-column">

                <li class="nav-item"><a href="{% url 'admin_dashboard' %}" class="nav-link text-white">Dashboard</a></li>

            </ul>
        </div>

        <div class="col-md-10">

                <div class="container-fluid">
                    <span class="navbar-brand">
                        Wholesale Grocery Management System

            <div class="p-4">
