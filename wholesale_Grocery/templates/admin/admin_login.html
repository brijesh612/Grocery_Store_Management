<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <center>
       <div class="container mt-5">
            <div class="row-md-10" justify-content-center>
                <div class="col-md-7">
                    <div class="card show">
                        <div class="card-header bg-primary text-white">
                            <h2>Admin Login</h2>
                        </div>
                        <div class="card-body">
                            <form method="POST">
{% csrf_token %}
                                <div class="mb-3">
                                    UserName :
                                    <input type="text" name="username" class="from-control" placeholder="Enter UserName" required>
                                </div>

                                <div class="mb-3">
                                    Password :
                                    <input type="password" name="password" class="from-control" placeholder="Enter Password" required>
                                </div>

                                <button type="submit" class="btn btn-success">Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
       </div>
    </center>
</body>
</html>
