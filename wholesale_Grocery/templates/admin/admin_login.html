<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
         <style>
            body{
                background: linear-gradient(135deg, #0d3b1e, #1f7d42);  /* background color */
                min-height: 100vh;
            }
            .admin-card{
                max-width: 380px;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            }
         </style>
</head>
<body class="d-flex align-items-center justify-content-center">

       <div class="card admin-card w-100 p-3 border-0">
        <div class="text-center my-3">
            <h3 class="fw-bold text-success">Admin Login</h3>
        </div>

        <div class="card-body pt-0">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">Username</label>
                    <input type="text" name="username" class="form-control py-2" placeholder="Enter Username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Password</label>
                    <input type="password" name="password" class="form-control py-2" placeholder="Enter Password" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
