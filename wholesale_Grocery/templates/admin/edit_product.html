{% extends 'admin/admin_base.html'%}

{% block content %}
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-3 p-4">
                        <h3 class="text-center mb-4">Edit Product</h3>
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-bold">Product Name:</label>
                                <input type="text" name="name" class="form-control" value="{{ product.productname }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Price:</label>
                                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Stock:</label>
                                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Description:</label>
                                <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-success px-4">Update Product</button>
                                <a href="{% url 'show_product' %}" class="btn btn-secondary px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
