{% extends 'admin/admin_base.html' %}
{% block content %}

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-dark mb-0">Product Management</h4>
        <a href="{% url 'show_product' %}" class="btn btn-primary btn-sm rounded-pill px-3 fw-bold">
            <i class="bi bi-eye-fill me-1"></i> Show All Products
        </a>
    </div>

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-success text-white py-3 px-4">
            <h5 class="card-title fw-bold mb-0">
                <i class="bi bi-box-seam me-2"></i>Add New Product
            </h5>
        </div>

        <div class="card-body p-4 bg-white">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Product Name</label>
                    <input type="text" name="productname" class="form-control rounded-3" placeholder="Enter Product Name" required>
                </div>

                <!-- Select Category -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Select Category</label>
                    <select name="category" class="form-select rounded-3" required>
                        <option value="" disabled selected>Choose Category...</option>
                        {% for c in category %}
                            <option value="{{ c.id }}">{{ c.categoryname }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Description</label>
                    <textarea name="description" class="form-control rounded-3" rows="4" placeholder="Enter product description" required></textarea>
                </div>

                <!-- Price & Stock -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">Price (₹)</label>
                        <input type="number" step="0.01" name="price" class="form-control rounded-3" placeholder="Enter Price" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">Stock Quantity</label>
                        <input type="number" name="stock" class="form-control rounded-3" placeholder="Enter Stock Quantity" required>
                    </div>
                </div>

                <!-- Main Image -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Main Product Image</label>
                    <input type="file" name="image" class="form-control rounded-3" accept="image/*" required>
                </div>

                <!-- Extra Gallery Images -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Other Images (Gallery)</label>
                    <input type="file" name="extra_images" class="form-control rounded-3" accept="image/*" multiple>
                </div>

                <!-- Status -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Status</label>
                    <select name="status" class="form-select rounded-3">
                        <option value="True" selected>Active</option>
                        <option value="False">Inactive</option>
                    </select>
                </div>

                <!-- Save Button -->
                <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold rounded-3 shadow-sm" style="background-color: #198754;">Save Product</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
