{% extends 'base.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
    <style>
        /* login page design */
           
            .login-card {
                display: flex;
                width: 750px;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.1);
                overflow: hidden;
                margin-top: 50px;
            }

                /* left panel */
            .left-panel {
                flex: 1;
                background: linear-gradient(135deg, #2b58a0, #4272c4);
                color: #fff;
                padding: 40px 30px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 20px;
            }

            .left-panel h2 {
                font-size: 22px;
                margin-bottom: 10px;
                letter-spacing: 1px;
            }

            .left-panel p {
                font-size: 14px;
                opacity: 0.9;
            }

                /* right panel */
            .right-panel {
                flex: 1.2;
                padding: 40px 30px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .input-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .input-group label {
                font-size: 13px;
                color: #333;
                font-weight: bold;
            }

            .pass-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .forgot {
                font-size: 12px;
                color: #666;
                text-decoration: none;
            }

            .input-group input {
                padding: 10px 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
            }

            .input-group input:focus {
                border-color: #2b58a0;
            }

            .btn {
                padding: 12px;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                color: #fff;
                cursor: pointer;
                font-weight: bold;
            }

            .btn-login {
                background-color: #2e7d32; 
            }

            .btn-register {
                background-color: #2b58a0; 
            }

            .btn:hover {
                opacity: 0.9;
            }

            @media (max-width: 600px) {
                .login-card {
                    flex-direction: column;
                    width: 90%;
            }
            }
    </style>
    <!-- message part -->
    {% if message %}
        {% for message in message %}
        <script>alert("{{message}}")</script>
        {% endfor %}
    {% endif %}
</head>
<body>

    <center>
    <div class="login-card">
        <div class="left-panel">
            <h2>Retailer Login</h2>
            <p><i class="bi bi-person-plus-fill me-2"></i>USERNAME</p>
            <P><i class="bi bi-lock-fill me-2"></i>PASSWORD</P>
        </div>

        <form method="POST" action="{% url 'login' %}" class="right-panel">
            {% csrf_token %}
             <div class="input-group">
                <label style="text-align: left;">UserName</label>
                <input type="text" name="username" placeholder="Enter UserName" required>
              </div>

              <div class="input-group">
                <div class="pass-header">  
                    <label>Password</label>
                    <a href="#">Forgot Password</a>
                 </div>
                    <input type="password" name="password" placeholder="Enter Password" required>
              </div>

                    <button type="submit" class="btn btn-success">Login</button>

                     <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
             </div>
        </form>
    </div>
    </center>
