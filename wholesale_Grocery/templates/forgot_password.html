{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 border-0 shadow-sm" style="max-width: 400px; width: 100%; border-radius: 12px;">
        <h4 class="fw-bold text-center mb-3">Forgot Password</h4>
        <p class="text-muted small text-center mb-4">Enter your registered email address to receive OTP.</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">Send OTP</button>
        </form>
    </div>
</div>
{% endblock %}
