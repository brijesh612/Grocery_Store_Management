{% extends 'base.html' %}
{% block content %}

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-lg border-0 rounded-4 p-4 text-center">
                        <h4 class="fw-bold mb-2">Verify OTP</h4>
                        <p class="text-muted small mb-4">send your email and enter a otp number</p>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-info small py-2">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input type="text" name="otp" class="form-control text-center fs-4 fw-bold letter-spacing-2" maxlength="6" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold py-2" style="border-radius: 10px;">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

{% endblock %}
