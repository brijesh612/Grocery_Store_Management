{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 border-0 shadow-sm" style="max-width: 400px; width: 100%; border-radius: 12px;">
        <h4 class="fw-bold text-center mb-3">Reset Password</h4>
        
        {% if error %}
            <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter new password" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
